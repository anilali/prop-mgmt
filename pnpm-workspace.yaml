packages:
  - apps/*
  - packages/api/*
  - packages/contexts/*
  - packages/infrastructure/*
  - packages/shared
  - packages/ui
  - tooling/*

allowBuilds:
  "@prisma/client": false
  "@prisma/engines": false
  better-sqlite3: false
  bufferutil: false
  core-js-pure: false
  esbuild: true
  prisma: false
  sharp: true
  utf-8-validate: false

catalog:
  "@better-auth/cli": 1.4.0-beta.9
  "@eslint/js": ^9.38.0
  "@react-pdf/renderer": ^4.9.0
  "@tailwindcss/postcss": ^4.1.16
  "@tailwindcss/vite": ^4.1.16
  "@tanstack/react-form": ^1.23.8
  "@tanstack/react-query": ^5.90.8
  "@trpc/client": ^11.7.1
  "@trpc/server": ^11.7.1
  "@trpc/tanstack-react-query": ^11.7.1
  "@types/node": ^22.18.12
  "@vitejs/plugin-react": 5.1.0
  better-auth: 1.4.0-beta.9
  eslint: ^9.38.0
  prettier: ^3.6.2
  postgres: ^3.4.7
  tailwindcss: ^4.1.16
  typescript: ^5.9.3
  vite: 7.1.12
  vitest: ^3.2.1
  zod: ^4.1.12

catalogs:
  react19:
    "@types/react": ~19.1.0
    "@types/react-dom": ~19.1.0
    react: 19.1.4
    react-dom: 19.1.4

linkWorkspacePackages: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild

overrides:
  "@types/minimatch": 5.1.2
  vite: 7.1.12

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
