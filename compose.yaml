services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: prop-mgmt-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: propmgmt
      POSTGRES_PASSWORD: propmgmt
      POSTGRES_DB: propmgmt
    volumes:
      - prop_mgmt_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propmgmt -d propmgmt"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: docker.io/minio/minio:latest
    container_name: prop-mgmt-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: propmgmt
      MINIO_ROOT_PASSWORD: propmgmtsecret
    volumes:
      - prop_mgmt_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: docker.io/minio/mc:latest
    container_name: prop-mgmt-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 propmgmt propmgmtsecret; do sleep 1; done;
      mc mb -p local/propmgmt-leases || true;
      exit 0;
      "

volumes:
  prop_mgmt_pg_data:
  prop_mgmt_minio_data:
